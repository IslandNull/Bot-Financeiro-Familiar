name: Deploy Val Town

on:
  push:
    branches: [main]
    paths:
      - "val-town/**"
      - ".github/workflows/deploy-val-town.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-val-town
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install pinned vt CLI
        run: deno install -gArf jsr:@valtown/vt@0.1.56
      - name: Clone deployment target
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
          VAL_TOWN_VAL: ${{ vars.VAL_TOWN_VAL }}
        run: |
          test -n "$VAL_TOWN_API_KEY" || { echo "Missing VAL_TOWN_API_KEY secret"; exit 1; }
          test -n "$VAL_TOWN_VAL" || { echo "Missing VAL_TOWN_VAL repository variable"; exit 1; }
          vt clone "$VAL_TOWN_VAL" "$RUNNER_TEMP/val-town" --no-editor-files
      - name: Mirror versioned proxy source
        run: |
          rsync -a --delete --exclude='.vt' val-town/ "$RUNNER_TEMP/val-town/"
      - name: Push to Val Town
        working-directory: ${{ runner.temp }}/val-town
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: vt push
